name: paypilot

# The whole product (needs a filled-in .env - `make env` or copy .env.example):
#   docker compose up -d --build
#     postgres -> backend (migrate + seed) -> frontend, worker
#              -> n8n-build -> n8n-import -> n8n
#   http://localhost:3000 app · :8000/docs API · :5678 n8n
#
# Postgres only, for `make dev`:   docker compose up -d postgres   (= make docker-up)
# Stop, keep data:                 docker compose stop              (= make docker-down)
# Wipe everything:                 docker compose down -v

x-n8n-env: &n8n-env
  GENERIC_TIMEZONE: America/Los_Angeles
  TZ: America/Los_Angeles
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  WEBHOOK_URL: http://localhost:5678/
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
      POSTGRES_DB: autopilot
    ports:
      - "5433:5432"
    volumes:
      - pga_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pga-backend
    restart: unless-stopped
    # Optional: without a .env the stack still runs (simulated PayPal,
    # deterministic agents). Copy .env.example to .env to add real keys.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      FRONTEND_URL: http://localhost:3000
      OUTBOX_RELAY_IN_PROCESS: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Inside the network n8n is "n8n", not localhost (used by the
      # Automation Center's "Flush event outbox" button).
      N8N_INVENTORY_WEBHOOK_URL: http://n8n:5678/webhook/pga-inventory-event
      N8N_BASE_URL: http://localhost:5678
      # Shared with n8n-build; .env wins, the fallback keeps a fresh clone working.
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-paypilot-local-n8n-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # First boot on an empty volume migrates and seeds ~15k transactions before
    # the API listens; the start period covers that, then it reports quickly.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: pga-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: PayPilot
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Delivers the event outbox (HMAC-signed) to n8n every 15s.
  #   docker compose up -d worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pga-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      N8N_INVENTORY_WEBHOOK_URL: http://n8n:5678/webhook/pga-inventory-event
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-paypilot-local-n8n-secret}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    # The image's HEALTHCHECK probes the API port, which the worker never opens.
    healthcheck:
      disable: true

  # ---------------------------------------------------------------- n8n
  # 1. Render the workflows for this network: n8n calls the API at
  #    http://backend:8000, the merchant id is read from the database, and the
  #    HMAC secret is the same value the backend and worker get above.
  n8n-build:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pga-n8n-build
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      PYTHONPATH: /app
      LOG_LEVEL: WARNING
      N8N_BACKEND_URL_FOR_N8N: http://backend:8000
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-paypilot-local-n8n-secret}
    volumes:
      - ./n8n:/work/n8n:ro
      - pga_n8n_deploy:/deploy
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "/work/n8n/compose_build.py", "/deploy"]
    healthcheck:
      disable: true

  # 2. Import and publish them before n8n boots - n8n reads activation only at
  #    startup, so importing into a running instance would leave the webhook
  #    unregistered until a restart.
  n8n-import:
    image: n8nio/n8n:2.46.5
    container_name: pga-n8n-import
    restart: "no"
    environment: *n8n-env
    volumes:
      - pga_n8n_data:/home/node/.n8n
      - pga_n8n_deploy:/deploy:ro
    depends_on:
      n8n-build:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Import leaves workflows unpublished (activeState=fromJson needs queue mode),
        # so each one is published explicitly afterwards.
        n8n import:workflow --separate --input=/deploy
        for id in PGAInventoryRouter PGAInventorySweeps PGAGrowthScan; do
          n8n publish:workflow --id=$$id
        done

  # 3. Serve. UI at http://localhost:5678 (create the owner account on first visit).
  n8n:
    image: n8nio/n8n:2.46.5
    container_name: pga-n8n
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "5678:5678"
    volumes:
      - pga_n8n_data:/home/node/.n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Optional evidence-search engine (Elasticsearch). Not started by default:
  #   docker compose --profile search up -d elasticsearch
  # then set ELASTIC_URL=http://elasticsearch:9200 in .env (http://localhost:9200
  # when running the API on the host) and press "Re-index" on Evidence Search.
  # Security is off because this is a local dev node bound to your machine only.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: pga-elasticsearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - pga_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  pga_pgdata:
  pga_n8n_data:
  pga_esdata:
  pga_n8n_deploy:
