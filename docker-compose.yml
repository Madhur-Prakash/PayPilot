name: paypilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
      POSTGRES_DB: autopilot
    ports:
      - "5433:5432"
    volumes:
      - pga_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pga-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
      FRONTEND_URL: http://localhost:3000
      OUTBOX_RELAY_IN_PROCESS: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: pga-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: PayPilot
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: deliver the event outbox from its own process.
  #   docker compose --profile worker up -d worker
  worker:
    profiles: ["worker", "full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pga-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot@postgres:5432/autopilot
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

volumes:
  pga_pgdata:
