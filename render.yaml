# PayPilot - Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Deploys, all on Render's free plan: managed Postgres 16 (pgvector is enabled by
# the first migration), Key Value (Redis-compatible), the FastAPI API (Docker, which
# also runs the event relays), n8n (the inventory/growth automation) and the Next.js
# web app (Node). Secrets are
# `sync: false` - Render prompts for them on first deploy; leave them blank to run
# the deterministic, simulated-PayPal demo judges can use without keys.
#
# Free-plan limits: services sleep after ~15 idle minutes (first request then takes
# about a minute - open the site before a demo), and the free database expires
# after 30 days.
#
# Key Value is what makes the sleeping API cheap to wake: the Channel3 caches (every
# miss spends credits), the per-merchant Channel3 call budget and the HTTP rate-limit
# counters live there instead of in memory, so they survive idle sleeps and deploys,
# and realtime events reach browsers connected to either instance during a deploy
# overlap. The free plan is 25 MB with no persistence - fine, because nothing in it
# is a source of truth (Postgres is). If it is ever down the API falls back to
# in-process state; see backend/app/core/redis.py.
#
# After the first deploy, if you renamed the services, update FRONTEND_URL /
# CORS_ORIGINS on the API and NEXT_PUBLIC_API_URL on the web service.

databases:
  - name: paypilot-db
    databaseName: paypilot
    user: paypilot
    plan: free
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  # The HMAC secret both directions of the API <-> n8n webhooks are signed with. One
  # generated value, attached to both services, so there is nothing to copy between them.
  - name: paypilot-n8n-link
    envVars:
      - key: N8N_WEBHOOK_SECRET
        generateValue: true

  - name: paypilot-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_PROTOCOL_SECRET
        generateValue: true
      - key: PAYPAL_SIMULATOR_WEBHOOK_SECRET
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: USD
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_SIMULATION_ENABLED
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_PAYEE_EMAIL
        sync: false
      # Read-only PayPal Agent Toolkit bridge (writes are blocked in code).
      - key: PAYPAL_MCP_ENABLED
        value: "true"
      # Optional sponsor integrations. Blank = a clearly labelled fallback.
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: ZAPIER_SIGNING_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # AG Studio's AI assistant: blank = Groq with GROQ_API_KEY. Groq's free tier is too
      # small for Studio's agents (a run took 9+ minutes and did not finish), so it is off
      # on the hosted demo. Set "true" once STUDIO_AI_* points at a provider with enough quota.
      - key: STUDIO_AI_ENABLED
        value: "false"
      - key: STUDIO_AI_BASE_URL
        sync: false
      - key: STUDIO_AI_API_KEY
        sync: false
      - key: STUDIO_AI_MODEL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      # Must match the region your Langfuse keys belong to (EU: https://cloud.langfuse.com).
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      # Optional voice assistant (Vapi). Its server URL is derived from BACKEND_URL.
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      # Optional live market signals; blank key = seeded signals.
      - key: EXTERNAL_SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      # Optional Gmail sending (invites, vendor purchase-order emails). Blank = the email
      # is written to the log and the PO's "Notify vendor" step shows as declined.
      # Mint the credential with: python backend/scripts/mint_gmail_token.py
      - key: GMAIL_CREDENTIALS_B64
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: MEMORY_ENABLED
        value: "true"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none

services:
  # Redis-compatible store for caches, rate-limit counters and realtime pub/sub.
  # An empty ipAllowList makes it reachable only from this workspace's services in
  # the same region (not the public internet). allkeys-lru: when the 25 MB fills,
  # evict the least recently used entry instead of refusing writes.
  - type: keyvalue
    name: paypilot-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: paypilot-api
    runtime: docker
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    # Migrate, seed the demo tenant (idempotent), then serve on Render's $PORT.
    # The steps live in a script: Render does not shell-parse quotes in dockerCommand.
    dockerCommand: sh scripts/render-start.sh
    envVars:
      - fromGroup: paypilot-shared
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      # Internal Key Value URL (redis://...). Blank/removed = everything runs in-process.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paypilot-redis
          property: connectionString
      - fromGroup: paypilot-n8n-link
      # The API runs the outbox and Zapier relays itself, so the whole blueprint fits
      # Render's free plan. The outbox relay idles until N8N_INVENTORY_WEBHOOK_URL is set,
      # the Zapier relay until ZAPIER_WEBHOOK_URL is set.
      # To run them in a separate process instead, add a paid `type: worker` service with
      # `dockerCommand: python -m app.worker` and set this to "false".
      - key: OUTBOX_RELAY_IN_PROCESS
        value: "true"
      # The paypilot-n8n service below (or any HTTPS n8n) - see docs/AUTOMATION.md.
      # Blank URL = inventory events are recorded but not delivered (marked SKIPPED).
      # Set once after the first deploy: https://<paypilot-n8n host>/webhook/pga-inventory-event
      # (Render appends a random suffix to the hostname, so it cannot be written here).
      - key: N8N_INVENTORY_WEBHOOK_URL
        sync: false
      # https://<paypilot-n8n host> - only used for "open in n8n" links.
      - key: N8N_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://paypilot-web-0lqv.onrender.com
      - key: BACKEND_URL
        value: https://paypilot-api-bjn2.onrender.com
      - key: CORS_ORIGINS
        value: https://paypilot-web-0lqv.onrender.com

  # n8n: the scheduler/router for inventory and growth automation (docs/AUTOMATION.md).
  # FREE PLAN, so three things to know:
  #  * It sleeps after ~15 idle minutes. Webhooks wake it (about a minute; the outbox
  #    relay retries), but its 02:00 / 06:30 schedules do not fire while it is asleep -
  #    see "Keeping the schedules alive" in docs/AUTOMATION.md.
  #  * No disk on the free plan, so n8n keeps its state in the free Postgres above
  #    (tables prefixed n8n_ next to the app's own).
  #  * 512 MB is tight for n8n; the heap is capped so it fails soft instead of being
  #    killed. If it restarts under load, that is the reason.
  # Health, for an external monitor (no auth):
  #   GET /healthz                       n8n process is up
  #   GET /healthz/readiness             ... and its database is reachable
  #   GET /webhook/pga-health            ... and the PGA workflows are registered
  #   GET /webhook/pga-health?deep=1     ... and n8n can reach the API (wakes it)
  - type: web
    name: paypilot-n8n
    runtime: docker
    region: oregon
    rootDir: n8n
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: paypilot-n8n-link
      - key: DB_TYPE
        value: postgresdb
      - key: DB_TABLE_PREFIX
        value: n8n_
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: paypilot-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: paypilot-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: paypilot-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: paypilot-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: paypilot-db
          property: password
      # Encrypts the credentials n8n stores. Generated once; must not change afterwards.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # Where n8n calls back into: the API's public URL (the free plan has no private network).
      - key: PGA_BACKEND_URL
        value: https://paypilot-api-bjn2.onrender.com
      # The merchant the scheduled sweeps run for: sign in to the app, open
      # GET /api/v1/merchants/current and copy the id. Blank = only the schedules refuse to run.
      - key: PGA_MERCHANT_ID
        sync: false
      # Editor login, created from the environment so nobody can claim an unowned n8n.
      # The password must be a bcrypt hash - see docs/AUTOMATION.md.
      - key: N8N_INSTANCE_OWNER_EMAIL
        sync: false
      - key: N8N_INSTANCE_OWNER_PASSWORD_HASH
        sync: false
      - key: GENERIC_TIMEZONE
        value: America/Los_Angeles
      - key: TZ
        value: America/Los_Angeles
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Keep the free database small: drop execution history after a week.
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

  - type: web
    name: paypilot-web
    runtime: node
    region: oregon
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://paypilot-api-bjn2.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: PayPilot
      - key: NEXT_PUBLIC_DEMO_EMAIL
        value: owner@juniperoak.com
      - key: NEXT_PUBLIC_DEMO_PASSWORD
        value: Autopilot@2024
      # Optional AG Studio licence key (removes the trial watermark). Baked in at build.
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      # Optional Bryntum Gantt licence key. A trial key extends the trial to its end date;
      # a purchased key removes the Trial badge. Baked in at build.
      - key: NEXT_PUBLIC_BRYNTUM_LICENSE_KEY
        sync: false
      # Optional voice assistant (browser-safe Vapi public key + assistant id). Baked in at build.
      - key: NEXT_PUBLIC_VAPI_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPI_ASSISTANT_ID
        sync: false

  # PayPilot's developer portal, built by APIMatic from apimatic/ (spec, guides, SDK and
  # Context Plugin pages). A free static site: the build runs the APIMatic CLI with an API
  # key from your APIMatic account (dashboard -> Account -> API Keys). Leave the key blank
  # and the build fails harmlessly; the API and web app are unaffected.
  - type: web
    name: paypilot-docs
    runtime: static
    rootDir: apimatic
    buildCommand: npx --yes @apimatic/cli@2.2.0 portal generate --input=./ --destination=./portal --force --auth-key=$APIMATIC_API_KEY
    staticPublishPath: ./portal
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APIMATIC_API_KEY
        sync: false
